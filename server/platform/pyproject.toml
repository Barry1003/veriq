[project]
name = "veriq-platform"
version = "0.5.0"
description = "Bank-controlled institutional intelligence and independent Cedar simulator"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.1", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "httpx>=0.27,<1"]
[dependency-groups]
dev = [
    "podman-compose>=1.5,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live_ai: opt-in real HTTP model integration tests", "full_stack: opt-in real isolated Cedar Veriq PostgreSQL worker model stack"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
