services:
  local-ai:
    build:
      context: ../var/llama-runtime
      dockerfile: ../../deploy/Dockerfile.local-ai
    command: ["--model", "/models/model.gguf", "--alias", "${LOCAL_MODEL_ALIAS:-veriq-qwen2.5-0.5b}", "--host", "0.0.0.0", "--port", "8181", "--ctx-size", "${LOCAL_MODEL_CONTEXT:-4096}", "--parallel", "1", "--threads", "4", "--batch-size", "64", "--ubatch-size", "32", "--n-gpu-layers", "0", "--chat-template", "chatml", "--no-webui"]
    volumes:
      - "../var/models/${LOCAL_MODEL_FILE:-qwen2.5-0.5b-instruct-ollama-q4_k_m.gguf}:/models/model.gguf:ro,z"
    networks: [bank]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8181/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 40
      start_period: 20s
    # No model port is exposed to the host; Veriq reaches it inside the internal bank network.
  veriq:
    environment:
      LOCAL_AI_URL: http://local-ai:8181/v1
      LOCAL_AI_MODEL: ${LOCAL_MODEL_ALIAS:-veriq-qwen2.5-0.5b}
      LOCAL_AI_ALLOWED_HOSTS: local-ai
      LOCAL_AI_TIMEOUT_SECONDS: "90"
      LOCAL_AI_MAX_OUTPUT_TOKENS: "512"
      AI_TASK_CONCURRENCY: "1"
      AUTO_AI_ENABLED: ${AUTO_AI_ENABLED:-true}
      AI_MODEL_CONFIG_VERSION: ${AI_MODEL_CONFIG_VERSION:-qwen0.5-ticket004-v1}
    depends_on:
      veriq-db: {condition: service_healthy}
      cedar: {condition: service_started}
